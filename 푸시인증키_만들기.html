<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>푸시 인증키 생성</title><style>body{font-family:system-ui;max-width:760px;margin:40px auto;padding:20px;line-height:1.7}textarea{width:100%;height:100px;overflow-wrap:anywhere}button{padding:14px;font-size:16px}label{display:block;margin-top:20px}</style><h1>푸시 인증키 만들기</h1><p>이 파일은 키를 내 브라우저에서 생성합니다. 외부로 전송하지 않습니다. <b>GitHub에 올리지 마세요.</b> 처음 한 번만 생성하고, 같은 키를 계속 사용하세요.</p><button id="make">새 키 만들기</button><label>VAPID_PUBLIC_KEY (공개 키)</label><textarea id="pub" readonly></textarea><label>VAPID_PRIVATE_KEY (비밀 키 — Cloudflare Secret으로만 저장)</label><textarea id="priv" readonly></textarea><p id="status"></p><script>
document.getElementById('make').onclick=async()=>{try{const pair=await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign','verify']);const jwk=await crypto.subtle.exportKey('jwk',pair.privateKey);const raw=new Uint8Array(await crypto.subtle.exportKey('raw',pair.publicKey));const enc=b=>btoa(String.fromCharCode(...b)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');document.getElementById('pub').value=enc(raw);document.getElementById('priv').value=jwk.d;document.getElementById('status').textContent='생성 완료. 비밀 키는 저에게 보내지 말고 Cloudflare Secret에 입력하세요.';}catch(e){document.getElementById('status').textContent=e.message;}};
</script></html>
